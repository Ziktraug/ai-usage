name: EXP Bun Vite Probe

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Vite dev 200-readiness under 1.3.13 vs 1.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: echo "nproc=$(nproc) mem=$(free -m | awk '/Mem:/{print $2}')MB"
      - run: bun install --frozen-lockfile
      - run: bun --filter @ai-usage/design-system build
      - run: bun run --cwd apps/web dev:prepare
      - name: Fetch bun 1.4.0 alongside
        run: |
          curl -sL -o /tmp/bun14.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          unzip -q /tmp/bun14.zip -d /tmp/bun14
          /tmp/bun14/bun-linux-x64/bun --version

      - name: Measure 200-readiness on both runtimes
        run: |
          set +e
          measure() {
            label="$1"; bunbin="$2"; port="$3"
            echo "::group::$label (port $port)"
            ( cd apps/web && AI_USAGE_SVELTEKIT_PHASE=dev \
              setsid "$bunbin" --no-env-file --bun vite --host 127.0.0.1 --port "$port" --strictPort \
              > /tmp/$label.log 2>&1 & echo $! > /tmp/$label.pid )
            start=$(date +%s%3N)
            first=""; firstcode=""; ok=""
            for i in $(seq 1 75); do
              code=$(curl -s -o /tmp/$label.body -w "%{http_code}" --max-time 5 "http://127.0.0.1:$port/" 2>/dev/null)
              if [ -n "$code" ] && [ "$code" != "000" ] && [ -z "$first" ]; then
                first=$(( $(date +%s%3N) - start )); firstcode=$code
              fi
              if [ "$code" = "200" ]; then ok=$(( $(date +%s%3N) - start )); break; fi
              sleep 1
            done
            echo "RESULT $label: first_ms=${first:-none} first_code=${firstcode:-none} ok200_ms=${ok:-NEVER}"
            echo "---- corps renvoye ($label, 1200 car.) ----"
            head -c 1200 /tmp/$label.body 2>/dev/null; echo
            echo "---- stderr/stdout vite ($label) ----"
            tail -40 /tmp/$label.log
            pgid=$(cat /tmp/$label.pid)
            kill -TERM -"$pgid" 2>/dev/null; sleep 2; kill -KILL -"$pgid" 2>/dev/null
            echo "::endgroup::"
          }
          measure bun1313 "$(which bun)" 4180
          measure bun140  /tmp/bun14/bun-linux-x64/bun 4181
