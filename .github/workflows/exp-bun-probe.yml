name: EXP Bun Vite Probe

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Real check under 1.3.13 vs 1.4.0, same runner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: echo "nproc=$(nproc) mem=$(free -m | awk '/Mem:/{print $2}')MB"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Fetch bun 1.4.0 alongside
        run: |
          curl -sL -o /tmp/bun14.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          unzip -q /tmp/bun14.zip -d /tmp/bun14
          /tmp/bun14/bun-linux-x64/bun --version

      - name: Run the real check under each runtime
        run: |
          set +e
          run_check() {
            label="$1"; bunbin="$2"
            echo "::group::$label"
            start=$(date +%s)
            "$bunbin" run test:web-production > /tmp/$label.out 2>&1
            rc=$?
            echo "RESULT $label: exit=$rc seconds=$(( $(date +%s) - start ))"
            echo "---- 80 premieres lignes ----"
            head -80 /tmp/$label.out
            echo "::endgroup::"
            sleep 5
          }
          run_check check1313 "$(which bun)"
          run_check check140  /tmp/bun14/bun-linux-x64/bun
          echo "===== SYNTHESE ====="
          grep -h "^RESULT" /dev/null 2>/dev/null
