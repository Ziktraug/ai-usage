name: PR Checks

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".claude/**"
      - ".agent-memory/**"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull_request checkout is the merge commit, so its first parent
          # is the base branch tip and `git diff HEAD^1 HEAD` is exactly the
          # PR change set. Depth 2 fetches both parents.
          fetch-depth: 2
      - id: scope
        name: Decide whether the browser jobs have anything to verify
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The browser jobs execute apps/web, and through it most of the
          # workspace packages; the demo/production job also boots
          # apps/usage-engine, which pulls in the rest. The only code
          # directory outside that surface is apps/cli, so the filter is
          # inverted: skip the browser jobs only when every changed file is
          # CLI-only or documentation.
          browser=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              apps/cli/*|*.md|docs/*|plans/*|.claude/*|.agent-memory/*|LICENSE) ;;
              *) browser=true ;;
            esac
          done <<EOF
          $(git diff --name-only HEAD^1 HEAD)
          EOF
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  static-types:
    name: Static and Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run typecheck

  unit-build:
    name: Unit, Build, Client Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run test:web-client-manifest
      - run: bun run test:web-bundle

  lifecycle:
    name: Production and Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:web-production
      - run: bun run test:web-dev-build-isolation

  functional-browser:
    name: Functional Browser
    needs: changes
    # A skipped job still reports its status (as passing), so this stays
    # compatible with required checks if branch protection is added later.
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      # Both e2e suites below start a real Vite dev server, which Bun
      # intermittently failed to bring up on 1.3.13 (~1 run in 8; PR #48 has
      # the diagnosis). The root cause is not identified, so the wrapper stays
      # on the Bun 1.4 line (ADR 0070). It retries only that signature and
      # never a test failure, so a genuine regression still fails on the first
      # attempt.
      - run: bun tools/retry-on-dev-server-hang.ts bun run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-browser-failures
          path: apps/web/test-results
          retention-days: 7

  demo-production-browser:
    name: Demo, Production, Performance
    needs: changes
    # A skipped job still reports its status (as passing), so this stays
    # compatible with required checks if branch protection is added later.
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun x playwright install --with-deps chromium
      - run: bun tools/retry-on-dev-server-hang.ts bun run test:e2e-demo
      - run: bun run test:e2e-production
      - run: bun run --cwd apps/web benchmark:session-scroll
      - name: Upload production browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-failures
          path: apps/web/test-results
          retention-days: 7
