# Manual harness for the intermittent `bun --bun vite` startup hang.
#
# The functional-browser job hits the hang at PR cadence with stdout discarded,
# which is why its cause is still unknown. This workflow reproduces the same
# cold start on demand with timestamped stdout+stderr per iteration.
#
# The first dispatch (2026-08-25, 15 sequential iterations, all DEBUG=vite:*)
# came back 0/15 an hour after a real PR run hung, which taught two lessons the
# current shape encodes:
# - Sequential iterations sample ONE runner VM. If the hang is conditioned on
#   the machine or its neighbors rather than an independent per-start race, one
#   job cannot see it -- hence the sample matrix fanning out across runners.
# - DEBUG=vite:* is itself a timing perturbation, and the job that hangs runs
#   without it -- hence iterations alternate debug off/on inside each sample
#   (see tools/stress-web-dev-start.ts).
#
# The second dispatch (v2 matrix, 48 direct starts across 8 VMs, both debug
# arms) also came back clean -- 0/63 cumulative against a real hang the same
# morning. A direct `bun --bun vite` spawn therefore does not reproduce; the
# default mode is now "playwright", the exact production chain (Playwright
# under Bun owning the webServer and running one real spec), which is the
# concurrency the direct mode lacked. Mode "direct" remains selectable as the
# minimal control arm.
name: Dev Server Startup Stress

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Cold starts per sample (each sample is one runner VM)
        default: "6"
        required: false
      debug:
        description: "DEBUG=vite:* mode: 0, 1, or alternate"
        default: alternate
        required: false
      mode:
        description: "Start chain: playwright (real e2e chain) or direct (vite alone)"
        default: playwright
        required: false
      bun-version:
        description: Bun version to stress (the hang is a runtime race; newer Bun may fix or worsen it)
        default: "1.3.13"
        required: false

permissions:
  contents: read

jobs:
  stress:
    name: Cold Start Stress (sample ${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun --filter @ai-usage/design-system build
      - run: bun run --cwd apps/web dev:prepare
      # Same precondition as the functional-browser job; also required by the
      # playwright mode, whose iterations run a real spec in a real browser.
      - run: bun x playwright install --with-deps chromium
      - run: bun tools/stress-web-dev-start.ts --iterations "${{ inputs.iterations }}" --debug "${{ inputs.debug }}" --mode "${{ inputs.mode }}"
      - name: Upload startup traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-stress-traces-sample-${{ matrix.sample }}
          path: .dev-server-stress
          # The traces live in a dot-directory, which upload-artifact v4.4+
          # silently drops by default -- the v3 run reproduced 30 hangs and
          # uploaded nothing.
          include-hidden-files: true
          retention-days: 14
